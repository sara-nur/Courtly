name: courtly

# Feature 2 — Dockerized infrastructure baseline.
# Secrets/config come from the repo-root .env (gitignored). Compose interpolates ${...} from it at parse
# time, and the api/worker also receive the whole file via env_file. The api/worker host names for Postgres
# and RabbitMQ are overridden here to the in-network service names, so .env can keep localhost for `dotnet run`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clash with a local Homebrew Postgres on host 5432)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - courtly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - courtly-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: src/Courtly.Api/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Override host-local values from .env with in-network service names.
      DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - courtly-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: src/Courtly.Worker/Dockerfile
    env_file: .env
    environment:
      DOTNET_ENVIRONMENT: Production
      # Override host-local values from .env with in-network service names (same as the api service).
      DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # Point the worker at the in-stack Mailpit catcher (plain SMTP on 1025, no TLS) regardless of .env values.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_SSL: "false"
      RESERVATION_HOLD_SCAN_SECONDS: "60"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - courtly-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-healthy && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/worker-healthy))) -lt 60 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    # Local mail catcher (feature 17): the Worker sends booking emails here; view them at http://localhost:8025.
    # Self-contained SMTP sandbox — no external account and no creds to ship in the .env zip. Accepts mail with or
    # without auth so the Worker (which sends without credentials) just works.
    image: axllent/mailpit:v1.30.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    networks:
      - courtly-net

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  courtly-net:
    driver: bridge
