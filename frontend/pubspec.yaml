name: courtly
description: "Courtly — tennis-court reservation system (admin + client)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management + DI (ProviderScope, AsyncValue) — F7
  flutter_riverpod: ^2.6.1
  # Declarative routing with persistent shells — F7
  go_router: ^14.6.2
  # Date/time + currency formatting (single source) — F7
  intl: ^0.19.0
  # Cached entity images in lists/tiles — F7
  cached_network_image: ^3.4.1
  # HTTP client + interceptors (JWT attach, 401 refresh, error mapping) — F8
  dio: ^5.7.0
  # Secure token storage (OS keychain / credential store) — F8
  flutter_secure_storage: ^9.2.2
  # OSM map tiles for the court location picker — F11
  flutter_map: ^7.0.2
  # LatLng type for flutter_map — F11
  latlong2: ^0.9.1
  # desktop image file selection — F11
  file_picker: ^8.1.4
  # dashboard KPI charts (revenue trend, peak hours, popular courts) — F19
  fl_chart: ^0.69.0
  # in-app PDF preview + system print dialog for the admin reports — F20
  printing: ^5.13.0
  # PdfPageFormat type used by the printing preview/layout callback — F20
  pdf: ^3.11.1
  # In-app Stripe PaymentSheet for the client booking payment — F26.
  # The publishable key is supplied at runtime from the server's intent
  # response (never hardcoded — rubric §3.3).
  flutter_stripe: ^11.5.0
  # "Add to Calendar" on the paid confirmation receipt — F26.
  add_2_calendar: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
