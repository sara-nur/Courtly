name: courtly
description: "Courtly — tennis-court reservation system (admin + client)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management + DI (ProviderScope, AsyncValue) — F7
  flutter_riverpod: ^2.6.1
  # Declarative routing with persistent shells — F7
  go_router: ^14.6.2
  # Date/time + currency formatting (single source) — F7
  intl: ^0.19.0
  # Cached entity images in lists/tiles — F7
  cached_network_image: ^3.4.1
  # HTTP client + interceptors (JWT attach, 401 refresh, error mapping) — F8
  dio: ^5.7.0
  # Secure token storage (OS keychain / credential store) — F8
  flutter_secure_storage: ^9.2.2
  # OSM map tiles for the court location picker — F11
  flutter_map: ^7.0.2
  # LatLng type for flutter_map — F11
  latlong2: ^0.9.1
  # desktop image file selection — F11
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
